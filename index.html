<!doctype html>
<html lang="en">
  <head>
    <!-- ================= BASIC SETTINGS ================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================= FAVICON ================= -->
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />

    <!-- ================= SEO ================= -->
    <title>Cheese & Co. Cafe | Good Food, Good Vibes & Great Memories</title>

    <meta
      name="description"
      content="Visit Cheese & Co. Cafe for delicious food, refreshing coffee, great ambience and unforgettable memories. Good food, good vibes and great moments await you."
    />

    <meta
      name="keywords"
      content="Cheese and Co Cafe, Cheese & Co Cafe, cafe, coffee, food, pizza, restaurant, cafe near me, best cafe"
    />

    <meta name="author" content="Cheese & Co. Cafe" />
    <meta name="robots" content="index, follow" />

    <!-- ================= OPEN GRAPH ================= -->
    <!-- Used by WhatsApp, Facebook, LinkedIn and other platforms -->

    <meta
      property="og:title"
      content="Cheese & Co. Cafe 🧀 | Good Food, Good Vibes"
    />

    <meta
      property="og:description"
      content="Good food. Great vibes. Beautiful memories. Come experience Cheese & Co. Cafe."
    />

    <meta property="og:type" content="website" />

    <!-- Replace with your real website URL after Vercel deployment -->
    <meta property="og:url" content="https://your-website.vercel.app/" />

    <!-- Social Media Preview Image -->
    <meta
      property="og:image"
      content="https://your-website.vercel.app/images/logo.jpg"
    />

    <meta property="og:image:alt" content="Cheese & Co. Cafe Logo" />

    <meta property="og:site_name" content="Cheese & Co. Cafe" />

    <!-- ================= TWITTER / X ================= -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Cheese & Co. Cafe 🧀 | Good Food, Good Vibes"
    />

    <meta
      name="twitter:description"
      content="Good food. Great vibes. Beautiful memories. Come experience Cheese & Co. Cafe."
    />

    <meta
      name="twitter:image"
      content="https://your-website.vercel.app/images/logo.jpg"
    />

    <!-- ================= THEME COLOR ================= -->

    <meta name="theme-color" content="#06120f" />

    <meta name="msapplication-TileColor" content="#06120f" />

    <!-- ================= PERFORMANCE ================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
